[project]
name = "hotel-ops-assistant"
version = "1.6.0"
description = "AI policy assistant for hotel front-desk staff: cited answers from messy hotel documents."
requires-python = ">=3.12"  # numpy 2.5 requires Python 3.12
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Measure the product code only; counting tests/ inflated a bare `pytest --cov` to 93% (real: 89%).
source = ["src", "eval", "codeguard"]
# The CLI runner is exercised by the CI retrieval gate; its grading logic lives in eval/metrics.py and is unit-tested.
omit = ["eval/run_eval.py"]
