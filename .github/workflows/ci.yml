name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: "Install (light, no PyTorch: the same install Streamlit Cloud uses)"
        run: pip install -r requirements.txt "pytest~=9.1" "pytest-cov~=7.1" "ruff==0.16.10" "pip-audit~=2.10"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Dependency audit (fails on any known vulnerability)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Unit tests with coverage
        run: python -m pytest -q --cov=src --cov=eval --cov-report=term-missing --cov-fail-under=70
      - name: Retrieval, scope and escalation regression gate (keyword-only, free)
        run: |
          python -m src.ingest --bm25-only
          python -m eval.run_eval --bm25-only --min-hit 0.85 --no-report
      - name: "Visitor questions gate: first-question routing and retrieval at the measured 100% (free)"
        run: python -m eval.run_visitor_eval --bm25-only --min-success 1.0 --no-report
      - name: Every curated suggestion retrieves a passage of its topic (free)
        run: python -m eval.run_suggestions_eval --bm25-only

  harness-gates:
    name: "Eval harness gates (hoteleval v1.0.0, recorded mode, no API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the app (light) and the eval harness at its release tag
        run: pip install -r requirements.txt "hoteleval @ git+https://github.com/vamsialladev/eval-harness@v1.0.0"
      - name: "Gate the recorded keyword-only run (retrieval and escalation recomputed from this checkout, no API)"
        run: |
          python -m src.ingest --bm25-only
          hoteleval gate --project hotel-ops-assistant --recorded eval/reports/2026-10-10_2011_bm25_answers_claude-haiku-5-5.jsonl --project-root .
