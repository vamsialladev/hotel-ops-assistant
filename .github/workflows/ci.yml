name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres for the persistent request log tests (tests/test_store.py); SQLite runs everywhere else.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-only@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: "Install (light, no PyTorch: the same install Streamlit Cloud uses)"
        run: pip install -r requirements.txt "pytest~=9.1" "pytest-cov~=7.1" "ruff==0.16.10" "pip-audit~=2.10"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Dependency audit (fails on any known vulnerability)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Unit tests with coverage
        run: python -m pytest -q --cov=src --cov=eval --cov-report=term-missing --cov-fail-under=70
      - name: Retrieval, scope and escalation regression gate (keyword-only, free)
        run: |
          python -m src.ingest --bm25-only
          python -m eval.run_eval --bm25-only --min-hit 0.85 --no-report
      - name: "Visitor questions gate: first-question routing and retrieval at the measured 100% (free)"
        run: python -m eval.run_visitor_eval --bm25-only --min-success 1.0 --no-report
      - name: Every curated suggestion retrieves a passage of its topic (free)
        run: python -m eval.run_suggestions_eval --bm25-only

  harness-gates:
    name: "Eval harness gates (hoteleval v1.0.0, recorded mode, no API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the app (light) and the eval harness at its release tag
        run: pip install -r requirements.txt "hoteleval @ git+https://github.com/vamsialladev/eval-harness@v1.0.0"
      - name: "Gate the recorded keyword-only run (retrieval and escalation recomputed from this checkout, no API)"
        run: |
          python -m src.ingest --bm25-only
          hoteleval gate --project hotel-ops-assistant --recorded eval/reports/2026-10-10_2011_bm25_answers_claude-haiku-5-5.jsonl --project-root .

  release-gate:
    name: "Release run v1.6.0 gated with latency and cost budgets (hoteleval v1.2.0, saved live run, no API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the eval harness at its release tag (standard library only)
        run: pip install "hoteleval @ git+https://github.com/vamsialladev/eval-harness@v1.2.0"
      - name: "Gate the saved live run of this release: hard gates, floors, stable flips, p95 and cost budgets"
        run: hoteleval gate --run-file eval/harness/p1-v1.6.0-2026-10-15.jsonl

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check (README and docs; fails on broken links)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30
            --accept "200..=299,403,429,503,999"
            --exclude "^https://(www\.)?linkedin\.com" --exclude "^https?://localhost" --exclude "^http://127\.0\.0\.1"
            README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md 'docs/**/*.md'
          fail: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
