# Curated questions the assistant can always answer, by topic and property. Used for the welcome screen
# ("Good questions look like…" and topic chips), follow-ups under answers, "Did you mean" after a refusal,
# and the chat input hint. Not indexed: it's a list of questions, not policy.
#
# A topic appears for a property only when the index has a passage in one of its `sections` (document
# headings) or `sources` (whole documents) for that property or the shared documents, and the topic has
# examples for that property. Every example must retrieve a passage of its topic and get a real answer:
# tests/test_suggestions.py and `python -m eval.run_suggestions_eval --answers` check both.
#
# There's no Safety topic: the only safety document is a scanned image the index can't read (decision 9).

[good]  # "Good questions look like…": one policy question, plain English. Also the popular fallback.
beach-resort = [
  "Can a guest bring their dog?",
  "How late can a Gold member check out on Saturday?",
  "What time is breakfast served?",
]
mountain-lodge = [
  "Can a guest bring their dog?",
  "Is breakfast included?",
  "Can a guest check in early?",
]

[[topics]]
id = "pets"
label = "Pets"
icon = ":material/pets:"
sections = ["Pets"]
[topics.examples]
beach-resort = ["Can a guest bring their dog?", "Are dogs allowed at the pool?", "Is there a fee for service animals?"]
mountain-lodge = ["Can a guest bring their dog?", "What is the pet fee?", "Can a guest bring a cat?"]

